<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ядро</title>
  <style>
    :root {
      --bg: #0f1115; --paper: #171a21; --line: #2a3140; --ink: #e8e4d9;
      --muted: #9aa3b2; --dim: #6b7382; --hole: #e8a54b; --in: #6fbf73;
      --out: #d16b6b; --lead: #7eb6ff; --in-bg: #142018; --out-bg: #2a1414;
      --hole-bg: #2a1f0e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif; }
    header { padding: 20px 24px 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.03em; }
    .lede { color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button {
      background: var(--paper); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    input.url { flex: 1; min-width: 220px; }
    button { cursor: pointer; }
    button.primary { background: var(--hole); color: #1a1206; border-color: var(--hole); font-weight: 650; }
    button.ok { background: var(--in-bg); color: var(--in); border-color: #2d4a30; }
    button.no { background: var(--out-bg); color: var(--out); border-color: #4a2d2d; }
    button.dim { color: var(--muted); }
    main { padding: 16px 24px 48px; }
    .meta { color: var(--dim); font-size: 13px; margin: 8px 0 16px; }
    .cols { display: grid; grid-template-columns: 1.1fr 1fr 0.7fr; gap: 14px; }
    @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }
    section { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 120px; }
    h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .card {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    }
    .card b { display: block; margin-bottom: 4px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .tag.S1, .tag.S2 { color: var(--in); border-color: #2d4a30; }
    .tag.S3, .tag.S4 { color: var(--out); border-color: #4a2d2d; }
    .tag.low, .tag.mid { color: var(--hole); border-color: #5a4320; }
    .tag.high { color: var(--out); }
    .tag.comparative, .tag.commercial, .tag.transactional { color: var(--lead); }
    .actions { display: flex; gap: 6px; margin-top: 6px; }
    .tree { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 13px; line-height: 1.7; }
    .tree .child { color: var(--hole); padding-left: 14px; }
    .tree .skip { color: var(--dim); text-decoration: line-through; }
    .warn { background: var(--hole-bg); border: 1px solid #5a4320; color: var(--hole); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
    .err { color: var(--out); }
  </style>
</head>
<body>
<header>
  <h1>Семантическое ядро</h1>
  <p class="lede">Вставь URL. Инструмент снимет живые формулировки, схлопнет их в вопросы и покажет, куда встроиться. Пачками, не всем скопом. Принимаешь или отклоняешь — ядро растёт.</p>
  <div class="bar">
    <input class="url" id="url" placeholder="https://сайт.ru" />
    <input id="brand" placeholder="бренд (если не с сайта)" />
    <select id="gate">
      <option value="human">я решаю</option>
      <option value="auto">само (НЧ/СЧ, S1/S2)</option>
    </select>
    <button class="primary" id="go">Собрать пачку</button>
    <button class="dim" id="more" hidden>Ещё пачка</button>
  </div>
</header>
<main>
  <div id="status" class="meta"></div>
  <div id="warn"></div>
  <div class="cols">
    <section>
      <h2>Входящие — эта пачка</h2>
      <div id="inbox"></div>
    </section>
    <section>
      <h2>Ядро — принято</h2>
      <div id="tree" class="tree"></div>
    </section>
    <section>
      <h2>Не берём</h2>
      <div id="out"></div>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let board = null;

  const BAND = { high: "ВЧ", mid: "СЧ", low: "НЧ", micro: "микро", unknown: "?" };
  const INSERT = {
    own_page: "своя страница + CTA",
    h2_of_parent: "H2 у родителя",
    comparison: "сравнение (своё или vc/habr)",
    offsite_review: "обзор на чужой площадке",
    skip: "не брать",
  };

  function qs() {
    return new URLSearchParams(location.search).get("slug");
  }

  async function start() {
    $("status").textContent = "собираю…";
    const body = {
      url: $("url").value.trim(),
      brand: $("brand").value.trim(),
      gate: $("gate").value,
      n: 12,
    };
    const res = await fetch("/api/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { $("status").innerHTML = `<span class="err">${data.detail || res.status}</span>`; return; }
    show(data);
    history.replaceState({}, "", `?slug=${data.slug}`);
  }

  async function more() {
    if (!board) return;
    $("status").textContent = "ещё пачка…";
    const res = await fetch("/api/round", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug: board.slug, n: 12 }) });
    show(await res.json());
  }

  async function decide(id, status) {
    const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug: board.slug, question_id: id, status }) });
    show(await res.json());
  }

  function card(q, withButtons) {
    const vol = q.volume == null ? "спрос не измерен" : q.volume + " / мес";
    const btns = withButtons ? `<div class="actions">
      <button class="ok" onclick="decide('${q.id}','accepted')">в ядро</button>
      <button class="no" onclick="decide('${q.id}','rejected')">не наше</button>
      <button class="dim" onclick="decide('${q.id}','deferred')">позже</button>
    </div>` : "";
    return `<div class="card">
      <b>${q.canonical}</b>
      <div class="tags">
        <span class="tag ${q.rel}">${q.rel}</span>
        <span class="tag ${q.band}">${BAND[q.band] || q.band}</span>
        <span class="tag ${q.intent}">${q.intent}</span>
        <span class="tag">${INSERT[q.insert] || q.insert}</span>
        <span class="tag">${vol}</span>
      </div>
      <div style="color:var(--dim);font-size:12px">${q.why}</div>
      ${btns}
    </div>`;
  }

  function renderTree(questions) {
    const accepted = questions.filter(q => q.status === "accepted");
    const byId = Object.fromEntries(accepted.map(q => [q.id, q]));
    const roots = accepted.filter(q => !q.parent_id || !byId[q.parent_id]);
    const children = (id) => accepted.filter(q => q.parent_id === id);
    function line(q, prefix) {
      const extra = INSERT[q.insert];
      let html = `<div class="${q.insert === "skip" ? "skip" : ""}">${prefix}${q.canonical} <span style="color:var(--dim)">· ${BAND[q.band]} · ${extra}</span></div>`;
      for (const c of children(q.id)) html += line(c, prefix + "└ ");
      return html;
    }
    if (!roots.length) return "<div style='color:var(--dim)'>пока пусто — прими что-то слева</div>";
    return roots.map(q => line(q, "")).join("");
  }

  function show(data) {
    board = data;
    $("more").hidden = false;
    $("brand").value = data.brand || "";
    $("url").value = data.url || $("url").value;
    $("gate").value = data.gate;
    const c = data.counts || {};
    $("status").textContent = `${data.brand} · раунд ${data.round} · входящие ${c.inbox || 0} · в ядре ${c.accepted || 0} · отказ ${c.rejected || 0} · режим ${data.gate}`;
    if (!data.volume_available) {
      $("warn").innerHTML = `<div class="warn">Объём сейчас не меряется (${data.doctor_verdict}). Формулировки живые (подсказки поиска). Чтобы появились НЧ/СЧ цифры — положи WORDSTAT_API_KEY в open-geo/.env. Философия та же: без цифры не врём, что спрос большой.</div>`;
    } else {
      $("warn").innerHTML = "";
    }
    const inbox = (data.questions || []).filter(q => q.status === "inbox" || q.status === "deferred");
    $("inbox").innerHTML = inbox.length ? inbox.map(q => card(q, true)).join("") : "<div style='color:var(--dim)'>пусто. жми «ещё пачка» или смени URL</div>";
    $("tree").innerHTML = renderTree(data.questions || []);
    const rejected = (data.questions || []).filter(q => q.status === "rejected");
    $("out").innerHTML = rejected.length ? rejected.map(q => `<div class="card"><b>${q.canonical}</b><div class="tags"><span class="tag S4">${q.rel}</span></div></div>`).join("") : "<div style='color:var(--dim)'>отклонённые запомнятся и больше не придут</div>";
  }

  $("go").onclick = () => start().catch(e => $("status").innerHTML = `<span class="err">${e}</span>`);
  $("more").onclick = () => more().catch(e => $("status").innerHTML = `<span class="err">${e}</span>`);

  (async () => {
    const slug = qs();
    if (!slug) return;
    const res = await fetch("/api/board/" + slug);
    if (res.ok) show(await res.json());
  })();
</script>
</body>
</html>
